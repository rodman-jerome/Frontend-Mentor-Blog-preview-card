<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="description" content="A blog preview card component built with HTML and CSS, featuring an image, category, date, title, description, and author information.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  
  <title>Frontend Mentor | Blog preview card</title>

  <link rel="stylesheet" href="styles.css">
  
</head>
<body>
  
  <main>
    
    <div class="container">
      
      <img src="illustration-article.svg" alt="Abstract geometric design" class="article-image">
      
      <button class="category">Learning</button>

      <div class="date">Published 21 Dec 2023</div>

      <p class="title">HTML & CSS foundations</p>

      <p class="description">These languages are the backbone of every website, defining structure, content, and presentation.</p>

      <div class="author-info">
        <a href="#" class="author-link" aria-label="View Greg Hooper profile">
            <img src="image-avatar.webp" alt="Greg Hooper" class="avatar">
            <span class="author">Greg Hooper</span>
        </a>
      </div>
      
    </div>
    
  </main>

  <footer class="attribution">
    Challenge by <img src="favicon-32x32.png" alt="logo"><a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. Coded by <a href="https://www.frontendmentor.io/profile/RJseekr">RJ</a>.
  </footer>

</body>
</html>
